!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ahmed Samir</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #050505;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 90%;
    max-width: 430px;
    padding: 40px 25px;
    text-align: center;
    background: #0b0b0b;
    border: 1px solid #252525;
    border-radius: 28px;
    box-shadow: 0 0 50px rgba(255,255,255,0.08);
}

.avatar {
    width: 115px;
    height: 115px;
    margin: auto;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 3px;
    background: linear-gradient(135deg,#111,#777);
    border: 2px solid #333;
}

h1 {
    margin-top: 22px;
    font-size: 27px;
    letter-spacing: 3px;
}

.bio {
    margin: 18px 0 28px;
    line-height: 2;
    color: #ccc;
    font-size: 14px;
    letter-spacing: 1px;
}

.btn {
    display: block;
    padding: 16px;
    margin: 13px 0;
    color: white;
    text-decoration: none;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    transition: 0.3s;
}

.btn:hover {
    background: #252525;
    transform: scale(1.03);
}

.footer {
    margin-top: 28px;
    color: #555;
    font-size: 11px;
    letter-spacing: 3px;
}
</style>
</head>

<body>

<div class="card">

    <div class="avatar">AS</div>

    <h1>AHMED SAMIR 🖤</h1>

    <div class="bio">
        <b>NO LIMITS. NO EXCUSES.</b><br>
        📈 BUILDING MY FUTURE<br>
        💎 DREAM BIG. MOVE DIFFERENT.<br>
        🥂 LEGACY IN THE MAKING.
    </div>

    <a class="btn" href="#">INSTAGRAM</a>
    <a class="btn" href="#">TIKTOK</a>
    <a class="btn" href="#">WHATSAPP</a>

    <div class="footer">
        RISE • BUILD • DOMINATE
    </div>

</div>

</body>
</html>
