<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Samir | Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.2rem;
            color: #94a3b8;
            font-weight: 400;
            margin-bottom: 25px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .tag {
            background: #1e293b;
            border: 1px solid #3b82f6;
            color: #e2e8f0;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.95rem;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Ahmed Samir</h1>
        <h2>🚀 Welcome to my personal website</h2>
        
        <div class="tags">
            <span class="tag">📈 Trader</span>
            <span class="tag">💪 Gym</span>
            <span class="tag">🚀 Building my future</span>
        </div>

        <div class="footer-note">
            👑 Never forget that I'm your uncle!
        </div>
    </div>

</body>
</html>
